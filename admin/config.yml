backend:
  name: github
  repo: lanreakalanes-blip/s-car-demo
  branch: main
  base_url: https://s-car-demo.vercel.app
  auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings & Updates"
    files:
      - label: "Settings"
        name: "settings"
        file: "content/settings.json"
        fields:
          - {label: "Announcement Banner (Leave blank to hide)", name: "banner", widget: "string"}
          - {label: "Workshop Status (e.g. Open Now / Closed)", name: "status", widget: "string"}

  - name: "cars"
    label: "Cars For Sale"
    files:
      - label: "Cars List"
        name: "cars"
        file: "content/cars.json"
        fields:
          # (Your existing car fields go here)

  - name: "reviews"
    label: "Customer Reviews"
    files:
      - label: "Reviews List"
        name: "reviews"
        file: "content/reviews.json"
        fields:
          # (Your existing review fields go here)