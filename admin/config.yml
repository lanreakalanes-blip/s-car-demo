backend:
  name: github
  repo: lanreakalanes-blip/s-car-demo
  branch: main
  base_url: https://s-car-demo.vercel.app
  auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings & Updates"
    files:
      - label: "Settings"
        name: "settings"
        file: "content/settings.json"
        fields:
          - {label: "Announcement Banner", name: "banner", widget: "string", required: false}
          - {label: "Workshop Status", name: "status", widget: "string", required: false}

  - name: "cars"
    label: "Cars For Sale"
    files:
      - label: "Cars List"
        name: "cars"
        file: "content/cars.json"
        fields:
          - label: "Cars List"
            name: "cars_list"
            widget: "list"
            fields:
              - {label: "Car Title", name: "title", widget: "string"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Mileage", name: "mileage", widget: "string"}
              - {label: "Transmission", name: "transmission", widget: "string"}
              - {label: "Badge / Status", name: "status", widget: "string", default: "IN STOCK"}
              - {label: "Car Image", name: "image", widget: "image"}

  - name: "reviews"
    label: "Customer Reviews"
    files:
      - label: "Reviews List"
        name: "reviews"
        file: "content/reviews.json"
        fields:
          - label: "Reviews List"
            name: "reviews_list"
            widget: "list"
            fields:
              - {label: "Customer Name", name: "name", widget: "string"}
              - {label: "Review Text", name: "text", widget: "text"}
              - {label: "Rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5}