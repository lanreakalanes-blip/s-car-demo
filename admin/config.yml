backend:
  name: github
  repo: lanreakalanes-blip/s-car-demo
  branch: main
  base_url: https://s-car-demo.vercel.app
  auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings & Updates"
    files:
      - label: "Settings"
        name: "settings"
        file: "content/settings.json"
        fields:
          - {label: "Announcement Banner", name: "banner", widget: "string", required: false}
          - {label: "Workshop Status", name: "status", widget: "string", required: false}

  - name: "cars"
    label: "Cars For Sale"
    files:
      - label: "Cars List"
        name: "cars"
        file: "content/cars.json"
        fields:
          - {label: "Car Title", name: "title", widget: "string"}
          - {label: "Price", name: "price", widget: "string"}

  - name: "reviews"
    label: "Customer Reviews"
    files:
      - label: "Reviews List"
        name: "reviews"
        file: "content/reviews.json"
        fields:
          - {label: "Review Title", name: "title", widget: "string"}